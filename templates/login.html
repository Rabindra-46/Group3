{% extends 'base.html' %}

{% block title %}Login - Phishing Detector{% endblock %}

{% block content %}
  <section class="auth-page">
    <div class="auth-card">
      <div class="auth-side">
        <p class="eyebrow">Secure access</p>
        <h1>Welcome back</h1>
        <p>Continue to your phishing detection dashboard and review suspicious email reports.</p>
      </div>
      <div class="auth-form">
        <h2>Login</h2>
        <form method="post">
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" required />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required />
          </div>
          <button type="submit" class="btn btn-primary w-100">Sign in</button>
        </form>
        <p class="form-note">New user? <a href="{{ url_for('main.register') }}">Create an account</a>.</p>
      </div>
    </div>
  </section>
{% endblock %}
