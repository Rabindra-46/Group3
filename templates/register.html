{% extends 'base.html' %}

{% block title %}Register - Phishing Detector{% endblock %}

{% block content %}
  <section class="auth-page">
    <div class="auth-card">
      <div class="auth-side">
        <p class="eyebrow">Create workspace</p>
        <h1>Start detecting safer</h1>
        <p>Set up an account for reporting, reviewing, and managing suspicious email activity.</p>
      </div>
      <div class="auth-form">
        <h2>Create account</h2>
        <form method="post">
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" required />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required />
          </div>
          <div class="mb-3">
            <label for="confirm_password" class="form-label">Confirm password</label>
            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required />
          </div>
          <button type="submit" class="btn btn-primary w-100">Create account</button>
        </form>
        <p class="form-note">Already have an account? <a href="{{ url_for('main.login') }}">Login</a>.</p>
      </div>
    </div>
  </section>
{% endblock %}
