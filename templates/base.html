<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Phishing Detector{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar navbar-expand-lg">
        <div class="container">
          <a class="navbar-brand" href="{{ url_for('main.home') }}">
            <span class="brand-mark">PD</span>
            <span>PhishDefender</span>
          </a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="mainNav">
            <div class="navbar-nav ms-auto align-items-lg-center">
              <a class="nav-link" href="{{ url_for('main.home') }}">Home</a>
              {% if session.get('user_email') %}
                <a class="nav-link" href="{{ url_for('main.dashboard') }}">Dashboard</a>
                <a class="btn btn-outline-light btn-sm ms-lg-3" href="{{ url_for('main.logout') }}">Logout</a>
              {% else %}
                <a class="nav-link" href="{{ url_for('main.login') }}">Login</a>
                <a class="btn btn-light btn-sm ms-lg-3" href="{{ url_for('main.register') }}">Create account</a>
              {% endif %}
            </div>
          </div>
        </div>
      </nav>
    </header>

    <main class="page-shell">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="container">
        <span>Phishing Email Detector</span>
        <span class="footer-dot"></span>
        <span>Secure analysis workspace</span>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
